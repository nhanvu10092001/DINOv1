[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dinov1"
version = "1.0.0"
description = "Modular DINOv1 Self-Supervised Learning Framework with 2D RoPE, Sparse Attention, and Dr. GRPO"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.20.0",
    "pyyaml>=6.0",
    "pillow>=9.0.0",
    "tqdm>=4.60.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "models*", "losses*", "dino_datasets*", "utils*", "eval*"]


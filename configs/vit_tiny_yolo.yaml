dataset:
  data_path: "data/train"
  global_crops_scale: [0.4, 1.0]
  local_crops_scale: [0.05, 0.4]
  local_crops_number: 6

model:
  type: MultiCropWrapper
  backbone:
    type: YOLOModel
    layers:
      # [from, repeats, module, args]
      # 0: Patch projection: in_chans=3, embed_dim=192, patch_size=16
      - [-1, 1, PatchEmbed, [224, 16, 3, 192]]
      # 1: Add CLS token and Positional Embedding (num_patches = (224/16)^2 = 196)
      - [-1, 1, PosEmbedAndClassToken, [192, 196]]
      # 2: 12 Transformer Blocks (dim=192, heads=3, mlp_ratio=4.0, qkv_bias=True)
      - [-1, 12, Block, [192, 3, 4.0, True]]
      # 3: Final LayerNorm over dim 192
      - [-1, 1, LayerNorm1d, [192]]
      # 4: Extract CLS Token (index 0)
      - [-1, 1, ExtractToken, [0]]
  head:
    type: DINOHead
    in_dim: 192
    out_dim: 16384
    use_bn: false
    norm_last_layer: true
    nlayers: 3
    hidden_dim: 2048
    bottleneck_dim: 256

loss:
  type: DINOLoss
  out_dim: 16384
  ncrops: 8
  student_temp: 0.1
  center_momentum: 0.9
  warmup_teacher_temp: 0.04
  teacher_temp: 0.04
  warmup_teacher_temp_epochs: 1
  nepochs: 2

train:
  epochs: 2
  batch_size_per_gpu: 32 # Optimized for 8GB VRAM RTX 3070
  gradient_accumulation_steps: 4 # Effective batch size = 128
  clip_grad: 3.0
  save_ckp_freq: 1
  output_dir: "checkpoints"
  optimizer:
    type: AdamW
    lr: 0.0005
    weight_decay: 0.04
  lr: 0.0005
  min_lr: 0.00001
  warmup_epochs: 1
  weight_decay: 0.04
  weight_decay_end: 0.4
  momentum_teacher: 0.996
